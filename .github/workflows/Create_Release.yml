name: Create Release and Run CodeQL

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release number (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_number }}
        release_name: Release ${{ github.event.inputs.release_number }}
        body: "Release created for tag ${{ github.event.inputs.release_number }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run_codeql:
    name: Run CodeQL Analysis
    runs-on: ubuntu-latest
    needs: create_release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.release_number }}
        dotnet-version: '6.0.35'
        
    - name: Install dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release
      
    - name: Test with the dotnet CLI
      run: dotnet test
        
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: 'csharp,javascript,typescript'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
