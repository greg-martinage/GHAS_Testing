name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release number (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_number }}
        release_name: Release ${{ github.event.inputs.release_number }}
        body: "Release created for tag ${{ github.event.inputs.release_number }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
