name: Generate Release Notes

on:
  push:
    tags:
      - 'v*'

jobs:
  release_notes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git commands
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: pip install jinja2 requests
      
      - name: Generate Release Notes
        run: python scripts/generate_release_notes.py
      
      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: "*_ReleaseNotes.md"
      
      - name: Get release file name
        id: get_filename
        run: |
          FILENAME=$(ls *_ReleaseNotes.md | head -1)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release (Optional)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: ${{ steps.get_filename.outputs.filename }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
